<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="shortcut icon" href="/favicon.ico">
<title>Köszönjük a foglalást! – Loft of Beauty</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&family=Nunito+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#3A0E1C; --plum:#7A1A34; --mokka:#A85C72; --rosegold:#E03E63; --puder:#FBD5DD; --ho:#FFFFFF; --cream:#FCE9ED;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',sans-serif;background:var(--cream);color:var(--ink);line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--ho);max-width:480px;width:100%;border-radius:20px;box-shadow:0 30px 70px rgba(122,26,52,.14);padding:44px 36px;text-align:center}
.chk{width:64px;height:64px;border-radius:50%;background:var(--rosegold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.9rem;margin:0 auto 20px}
h1{font-family:'Poppins',sans-serif;font-weight:800;font-size:1.5rem;margin-bottom:14px}
p{color:var(--mokka);font-size:.98rem;margin-bottom:10px}
.back{display:inline-block;margin-top:18px;background:var(--rosegold);color:#fff;padding:.8rem 1.8rem;border-radius:999px;font-weight:700;font-size:.9rem}
</style>
<script src="assets/consent.js"></script>
<script src="assets/attribution.js"></script>
</head>
<body>
<div class="card">
  <div class="chk">✓</div>
  <h1>Köszönjük a foglalást!</h1>
  <p id="svcLine">Hamarosan visszaigazoljuk telefonon.</p>
  <p>24 órán belül hívunk – ha kérdésed van, hívj minket: <a href="tel:+36305039156">+36 30 503 9156</a>.</p>
  <a class="back" href="/">Vissza a főoldalra</a>
</div>
<script>
(function(){
  var params = new URLSearchParams(location.search);
  var svc = params.get('svc');
  var value = parseFloat(params.get('value')) || 12000;
  if(svc){
    document.getElementById('svcLine').textContent = 'Foglalt kezelés: ' + svc + '. Hamarosan visszaigazoljuk telefonon.';
  }
  // A "b" paraméter a foglalás azonosítója — ettől foglalásonként egyedi a
  // védelem (frissítés / vissza gomb ne küldje újra), és ez az eventID is.
  var bookingId = params.get('b') || '';
  var fireKey = 'kj_lead_fired_' + location.search;

  function fireLead(){
    if(typeof fbq !== 'function') return;
    try{ if(sessionStorage.getItem(fireKey)) return; }catch(e){}
    var opts = bookingId ? { eventID: 'lead_' + bookingId } : undefined;
    fbq('track', 'Lead', { content_name: svc || 'Idopontfoglalas', value: value, currency: 'HUF' }, opts);
    fbq('track', 'Schedule', { content_name: svc || 'Idopontfoglalas' }, bookingId ? { eventID: 'schedule_' + bookingId } : undefined);
    try{ sessionStorage.setItem(fireKey, '1'); }catch(e){}
  }

  // Már elfogadott sütik esetén a Pixel (consent.js) itt már él → azonnal megy.
  // Ha a látogató csak most, ezen az oldalon fogadja el, a consent.js jelzésére megy.
  // Elutasításkor semmi nem megy ki.
  if(typeof fbq === 'function'){
    fireLead();
  }else{
    document.addEventListener('lb:pixel-ready', fireLead, { once: true });
  }
})();
</script>
</body>
</html>
